name: Deploy

# La imagen se construye aquí (el servidor de Dokploy no tiene memoria para `next build`), se
# publica en ghcr y Dokploy solo la descarga y la levanta. Se despliega por etiqueta sha-<commit>
# para poder volver a una versión anterior desde Dokploy o re-ejecutando este workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/agchavez/wedding-planner

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ vars.DOKPLOY_APP_ID }}
        run: node scripts/dokploy-deploy.mjs "$IMAGE:sha-$GITHUB_SHA"

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://wedding.partners.hn/api/health; then exit 0; fi
            sleep 5
          done
          echo "La app no respondió por HTTPS" && exit 1

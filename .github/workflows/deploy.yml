name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /opt/wedding-planner
      IMAGE: wedding-planner:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # El servidor tiene 1 GB de RAM: la imagen se construye aquí y se envía ya lista.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save "$IMAGE" | gzip > image.tar.gz

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host prod
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          CFG

      - name: Write production env
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          umask 077
          {
            echo "MONGODB_URI=$MONGODB_URI"
            echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            echo "BETTER_AUTH_URL=https://$DOMAIN"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } > app.env
          { echo "DOMAIN=$DOMAIN"; echo "APP_VERSION=${{ github.sha }}"; } > compose.env

      - name: Upload artifacts
        run: |
          ssh prod "mkdir -p $APP_DIR"
          scp image.tar.gz deploy/docker-compose.yml deploy/Caddyfile prod:$APP_DIR/
          scp app.env prod:$APP_DIR/.env
          scp compose.env prod:$APP_DIR/compose.env

      - name: Release
        run: |
          ssh prod "APP_DIR=$APP_DIR IMAGE=$IMAGE bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          chmod 600 .env
          gunzip -c image.tar.gz | docker load
          rm image.tar.gz
          docker tag "$IMAGE" wedding-planner:latest
          docker compose --env-file compose.env up -d --remove-orphans
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wedding-planner-app 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker ps --filter name=wedding-planner
          [ "$status" = "healthy" ] || { docker logs --tail 80 wedding-planner-app; exit 1; }
          # Conserva solo las 3 imágenes más recientes (para poder volver atrás).
          docker images wedding-planner --format '{{.Tag}} {{.CreatedAt}}' | grep -v '^latest ' | sort -k2 -r | tail -n +4 | awk '{print "wedding-planner:"$1}' | xargs -r docker rmi || true
          REMOTE

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DOMAIN }}/api/health"; then exit 0; fi
            sleep 5
          done
          echo "La app no respondió por HTTPS" && exit 1

name: Commit lint

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    name: Validate PR commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6

# Stack de producción en el servidor (/opt/wedding-planner). Lo copia y levanta el
# workflow .github/workflows/deploy.yml; el .env lo genera el mismo workflow.
services:
  app:
    image: wedding-planner:${APP_VERSION:-latest}
    container_name: wedding-planner-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Tegucigalpa
    volumes:
      # Comprobantes de pago subidos desde Gastos (ver src/lib/uploads.ts).
      - uploads:/app/uploads
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    container_name: wedding-planner-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  uploads:
  caddy-data:
  caddy-config:
